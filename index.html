<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir N.S Game - Pro</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 10px; }
        .app { max-width: 400px; margin: auto; background: #222; padding: 15px; border-radius: 10px; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00ff00; margin: 5px 0 15px 0; letter-spacing: 2px; }
        .section { background: #333; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #007bff; }
        label { display: block; font-size: 12px; color: #bbb; margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px; border-radius: 5px; border: none; background: #eee; color: #000; font-size: 16px; box-sizing: border-box; }
        
        .menu-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; background: #444; padding: 8px; border-radius: 5px; }
        .menu-name { flex: 2; font-size: 14px; }
        .menu-qty { flex: 1; text-align: right; }
        .menu-qty input { width: 60px; text-align: center; padding: 5px; background: #fff; }

        /* Area Struk */
        #areaStruk { background: #fff; color: #000; padding: 15px; margin-top: 15px; font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.3; border-radius: 2px; }
        .btn-print { background: #28a745; color: white; border: none; width: 100%; padding: 15px; margin-top: 10px; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-print:active { background: #1e7e34; transform: scale(0.98); }
        .btn-rekap { background: #007bff; color: white; border: none; width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        
        #panelRiwayat { display:none; background:#f8f9fa; color:#333; margin-top:15px; padding:15px; border-radius:8px; border: 1px solid #ccc; }
        .item-riwayat { border-bottom: 1px solid #ddd; padding: 5px 0; display: flex; justify-content: space-between; }

        /* Pengaturan Cetak */
        @media print {
            body { background: white; margin: 0; padding: 0; }
            .app, .btn-print, .btn-rekap, .section, #panelRiwayat { display: none !important; }
            #areaStruk { display: block !important; width: 100%; border: none; margin: 0; padding: 0; }
        }
    </style>
</head>
<body>

<div class="app">
    <h2>N.S GAME</h2>

    <div class="section">
        <label>Layanan Sewa:</label>
        <select id="layanan" onchange="updateMenuSewa()">
            <option value="tempat">Main di Tempat (5rb/jam)</option>
            <option value="sewa">Sewa Bawa Pulang (Paket)</option>
        </select>
        <div style="margin-top:8px">
            <select id="pilihanSewa" onchange="hitung()"></select>
        </div>
        <label style="margin-top:8px"><input type="checkbox" id="tv" onchange="hitung()"> Tambah TV (+30rb)</label>
    </div>

    <div class="section">
        <label>Kantin:</label>
        <div class="menu-row"><span class="menu-name">Air Mineral (3k)</span><div class="menu-qty"><input type="number" id="qty_mineral" value="0" min="0" oninput="hitung()"></div></div>
        <div class="menu-row"><span class="menu-name">Kopi (5k)</span><div class="menu-qty"><input type="number" id="qty_kopi" value="0" min="0" oninput="hitung()"></div></div>
        <div class="menu-row"><span class="menu-name">Es Teh (5k)</span><div class="menu-qty"><input type="number" id="qty_esteh" value="0" min="0" oninput="hitung()"></div></div>
        <div class="menu-row"><span class="menu-name">Indomie Tlr (10k)</span><div class="menu-qty"><input type="number" id="qty_mie" value="0" min="0" oninput="hitung()"></div></div>
    </div>

    <div class="section" style="border-left-color: #ffc107;">
        <label>Pembayaran:</label>
        <input type="number" id="bayar" placeholder="Input Uang Pembeli" oninput="hitung()">
    </div>

    <div id="areaStruk">
        <div style="text-align: center; font-weight: bold; font-size: 16px;">N.S GAME</div>
        <div id="infoStruk" style="text-align: center; font-size: 11px; margin-bottom: 5px;"></div>
        <div style="border-bottom: 1px dashed #000; margin: 5px 0;"></div>
        <div id="rincian"></div>
        <div style="border-top: 1px dashed #000; margin: 5px 0;"></div>
        <div id="totalan" style="font-weight: bold;"></div>
        <div style="text-align: center; margin-top: 15px; font-size: 10px;">Terima kasih atas kunjungannya!<br>Main lagi ya!</div>
    </div>

    <button class="btn-print" onclick="prosesCetak()">CETAK STRUK</button>
    <button class="btn-rekap" onclick="tampilRiwayat()">LIHAT REKAPAN</button>

    <div id="panelRiwayat">
        <h3 style="text-align:center; margin:0 0 10px 0; font-size: 16px;">Rekap Pendapatan</h3>
        <div id="listRiwayat"></div>
        <hr>
        <div id="totalPendapatan" style="font-weight:bold; font-size: 14px; text-align: right;"></div>
        <button onclick="hapusRiwayat()" style="width:100%; margin-top:10px; background:#dc3545; color:#fff; border:none; padding:8px; border-radius:5px; cursor:pointer;">Hapus Semua Data</button>
    </div>
</div>

<script>
    const menuKantin = [
        { id: 'qty_mineral', nama: 'Air Mineral', harga: 3000 },
        { id: 'qty_kopi', nama: 'Kopi', harga: 5000 },
        { id: 'qty_esteh', nama: 'Es Teh', harga: 5000 },
        { id: 'qty_mie', nama: 'Indomie Telur', harga: 10000 }
    ];

    let totalSemuaGlobal = 0;

    function updateMenuSewa() {
        const layanan = document.getElementById('layanan').value;
        const pilihan = document.getElementById('pilihanSewa');
        pilihan.innerHTML = "";
        if (layanan === "tempat") {
            for(let i=1; i<=12; i++) {
                let opt = document.createElement('option');
                opt.value = i * 5000;
                opt.text = i + " Jam (TKP)";
                pilihan.appendChild(opt);
            }
        } else {
            let paket = [[35000, "Paket 8 Jam"], [40000, "Paket 10 Jam"], [45000, "Paket 12 Jam"]];
            paket.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p[0]; opt.text = p[1];
                pilihan.appendChild(opt);
            });
        }
        hitung();
    }

    function hitung() {
        let hrgSewa = parseInt(document.getElementById('pilihanSewa').value) || 0;
        let hrgTV = document.getElementById('tv').checked ? 30000 : 0;
        let textSewa = document.getElementById('pilihanSewa').options[document.getElementById('pilihanSewa').selectedIndex].text;
        
        let skrg = new Date();
        let tglStr = skrg.getDate() + "/" + (skrg.getMonth()+1) + "/" + skrg.getFullYear() + " " + skrg.getHours() + ":" + skrg.getMinutes();
        document.getElementById('infoStruk').innerHTML = `ID: NSG-${skrg.getTime().toString().slice(-4)}<br>${tglStr}`;

        let rincianHTML = `<div style="display:flex; justify-content:space-between"><span>${textSewa}</span><span>${hrgSewa.toLocaleString()}</span></div>`;
        if(hrgTV > 0) rincianHTML += `<div style="display:flex; justify-content:space-between"><span>Sewa TV</span><span>30.000</span></div>`;
        
        let totalKantin = 0;
        menuKantin.forEach(item => {
            let qty = parseInt(document.getElementById(item.id).value) || 0;
            if(qty > 0) {
                let sub = qty * item.harga;
                totalKantin += sub;
                rincianHTML += `<div style="display:flex; justify-content:space-between"><span>${item.nama} x${qty}</span><span>${sub.toLocaleString()}</span></div>`;
            }
        });

        totalSemuaGlobal = hrgSewa + hrgTV + totalKantin;
        let uangBayar = parseInt(document.getElementById('bayar').value) || 0;
        let kembali = uangBayar - totalSemuaGlobal;

        document.getElementById('rincian').innerHTML = rincianHTML;
        document.getElementById('totalan').innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-top:5px"><span>TOTAL</span><span>Rp${totalSemuaGlobal.toLocaleString()}</span></div>
            <div style="display:flex; justify-content:space-between"><span>BAYAR</span><span>Rp${uangBayar.toLocaleString()}</span></div>
            <div style="display:flex; justify-content:space-between"><span>KEMBALI</span><span>Rp${kembali >= 0 ? kembali.toLocaleString() : 0}</span></div>
        `;
    }

    function prosesCetak() {
        if (totalSemuaGlobal <= 0) {
            alert("Isi pesanan dulu!");
            return;
        }

        // Simpan ke Riwayat (LocalStorage)
        let history = JSON.parse(localStorage.getItem('riwayat_nsgame')) || [];
        history.push({ 
            tgl: new Date().toLocaleTimeString('id-ID'), 
            total: totalSemuaGlobal 
        });
        localStorage.setItem('riwayat_nsgame', JSON.stringify(history));
        
        // Perintah Cetak
        window.print();
    }

    function tampilRiwayat() {
        const panel = document.getElementById('panelRiwayat');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        
        let history = JSON.parse(localStorage.getItem('riwayat_nsgame')) || [];
        let listHTML = "";
        let totalOmset = 0;

        history.forEach((data) => {
            listHTML += `<div class="item-riwayat"><span>🕒 ${data.tgl}</span> <b>Rp${data.total.toLocaleString()}</b></div>`;
            totalOmset += data.total;
        });

        document.getElementById('listRiwayat').innerHTML = listHTML || "<p style='text-align:center'>Belum ada transaksi</p>";
        document.getElementById('totalPendapatan').innerHTML = `TOTAL OMSET: Rp ${totalOmset.toLocaleString()}`;
    }

    function hapusRiwayat() {
        if(confirm("Yakin ingin menghapus semua rekapan hari ini?")) {
            localStorage.removeItem('riwayat_nsgame');
            tampilRiwayat();
        }
    }

    updateMenuSewa();
</script>

</body>
</html>
