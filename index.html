<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir N.S Game - Fix</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 10px; }
        .app { max-width: 400px; margin: auto; background: #222; padding: 15px; border-radius: 10px; border: 1px solid #444; }
        h2 { text-align: center; color: #00ff00; }
        .section { background: #333; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #007bff; }
        label { display: block; font-size: 12px; color: #bbb; margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px; border-radius: 5px; border: none; background: #eee; color: #000; font-size: 16px; box-sizing: border-box; }
        .menu-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; background: #444; padding: 8px; border-radius: 5px; }
        .menu-name { font-size: 14px; }
        .menu-qty input { width: 60px; text-align: center; padding: 5px; }

        /* AREA STRUK (Harus Hitam di Putih agar tidak Blank) */
        #areaStruk { background: #fff; color: #000; padding: 15px; margin-top: 15px; font-family: monospace; border-radius: 2px; min-height: 100px; }
        
        .btn-print { background: #28a745; color: white; border: none; width: 100%; padding: 15px; margin-top: 10px; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        @media print {
            body { background: white; }
            .app > *:not(#areaStruk) { display: none !important; }
            #areaStruk { display: block !important; position: absolute; top: 0; left: 0; width: 100%; border: none; }
        }
    </style>
</head>
<body>

<div class="app">
    <h2>N.S GAME</h2>

    <div class="section">
        <label>Layanan Sewa:</label>
        <select id="layanan" onchange="updateMenuSewa()">
            <option value="tempat">Main di Tempat (5rb/jam)</option>
            <option value="sewa">Sewa Bawa Pulang (Paket)</option>
        </select>
        <div style="margin-top:8px">
            <select id="pilihanSewa" onchange="hitung()"></select>
        </div>
    </div>

    <div class="section">
        <label>Kantin (Isi Jumlah):</label>
        <div class="menu-row"><span class="menu-name">Air Mineral (3k)</span><div class="menu-qty"><input type="number" id="qty_mineral" value="0" min="0" oninput="hitung()"></div></div>
        <div class="menu-row"><span class="menu-name">Indomie Tlr (10k)</span><div class="menu-qty"><input type="number" id="qty_mie" value="0" min="0" oninput="hitung()"></div></div>
    </div>

    <div class="section">
        <label>Bayar:</label>
        <input type="number" id="bayar" placeholder="0" oninput="hitung()">
    </div>

    <div id="areaStruk">
        <div style="text-align: center; font-weight: bold;">N.S GAME</div>
        <div id="waktuStruk" style="text-align: center; font-size: 10px;"></div>
        <hr style="border: 0.5px dashed #000;">
        <div id="rincian"></div>
        <hr style="border: 0.5px dashed #000;">
        <div id="totalan"></div>
    </div>

    <button class="btn-print" onclick="prosesCetak()">CETAK STRUK</button>
</div>

<script>
    function updateMenuSewa() {
        const layanan = document.getElementById('layanan').value;
        const pilihan = document.getElementById('pilihanSewa');
        pilihan.innerHTML = "";
        if (layanan === "tempat") {
            for(let i=1; i<=5; i++) {
                let opt = document.createElement('option');
                opt.value = i * 5000; opt.text = i + " Jam (TKP)";
                pilihan.appendChild(opt);
            }
        } else {
            let opt = document.createElement('option');
            opt.value = 35000; opt.text = "Paket 8 Jam";
            pilihan.appendChild(opt);
        }
        hitung();
    }

    function hitung() {
        let hrgSewa = parseInt(document.getElementById('pilihanSewa').value) || 0;
        let textSewa = document.getElementById('pilihanSewa').options[document.getElementById('pilihanSewa').selectedIndex].text;
        
        let qtyMnr = parseInt(document.getElementById('qty_mineral').value) || 0;
        let qtyMie = parseInt(document.getElementById('qty_mie').value) || 0;
        let totalKantin = (qtyMnr * 3000) + (qtyMie * 10000);
        
        let totalSemua = hrgSewa + totalKantin;
        let bayar = parseInt(document.getElementById('bayar').value) || 0;
        let kembali = bayar - totalSemua;

        // Tampilkan ke Struk
        document.getElementById('waktuStruk').innerText = new Date().toLocaleString();
        document.getElementById('rincian').innerHTML = `
            ${textSewa}: Rp${hrgSewa.toLocaleString()}<br>
            ${qtyMnr > 0 ? 'Mineral x' + qtyMnr + ': Rp' + (qtyMnr * 3000).toLocaleString() + '<br>' : ''}
            ${qtyMie > 0 ? 'Indomie x' + qtyMie + ': Rp' + (qtyMie * 10000).toLocaleString() + '<br>' : ''}
        `;
        document.getElementById('totalan').innerHTML = `
            <b>TOTAL   : Rp${totalSemua.toLocaleString()}</b><br>
            BAYAR   : Rp${bayar.toLocaleString()}<br>
            KEMBALI : Rp${kembali > 0 ? kembali.toLocaleString() : 0}
        `;
    }

    function prosesCetak() {
        window.print();
    }

    updateMenuSewa();
</script>
</body>
</html>
